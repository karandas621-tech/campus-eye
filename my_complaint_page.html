<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my complaint page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: whitesmoke;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .header {
            text-align: center;
            padding: 20px;

             
        }

        .complaints {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 800px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .complaint-card {
            border: 2px solid lightgray;
            border-radius: 10px;
            padding: 20px;
            /* margin-bottom: 20px; */
            box-shadow: 0 0 8px lightgray;
            transition: 0.3s;

        }

        .complaint-card:hover {
            transform: translateY(-5px);
        }

        button {
             
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: 1px solid rgb(213, 16, 16);
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 10px gray;
            

        }

        button:hover {
            background-color: rgb(0, 139, 30);
            transform: scale(1.1);
        }

        .resolved {
            background-color: green;
            color: white;
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .pending {
            background-color: rgb(230, 10, 10);
            color: white;
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .progress {
            background-color: rgb(13, 210, 224);
            color: white;
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
        .top{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>

</head>

<body>
    <div class="complaints">
        <div class="header">
            <h1>CampusEye</h1>
            <br>

            <h2>my complaint</h2>

        </div>


        <div class="complaint-card">
            <div class="top">
                 <h3>water complaint</h3>
                <button>view Details</button>
            

            </div>


            
            <p><strong>category:</strong> water</p>
            <p><strong>Status:</strong>
                <span class="resolved">Resolved</span>
            </p>

            <p><strong>date:</strong> 2 may 2001</p>
             
             

        </div>

        <div class="complaint-card">
            <div class="top">
                 <h3>electrical complaint</h3>
                <button>view Details</button>
            
            </div>


            
            <p><strong>category: </strong> electrical</p>
            <p><strong>Status:</strong>
                <span class="pending">pending</span>
            </p>

            <p><strong>date:</strong> 2 may 2002</p>
              

            

        </div>




        <div class="complaint-card">
            <div class="top">
                <h3>wifi complaint</h3>
                <button>view Details</button>
            </div>
             
            <p> <strong>category: </strong> Internet</p>
             <p><strong>Status:</strong>
    <span class="progress"> In progress</span>
</p>

            <p><strong>date:</strong> 2 may 2003</p>
              
            </div>


        </div>




    </div>

</body>

</html>
